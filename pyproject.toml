[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "web-health-scanner"
version = "2.1.0"
description = "A simple, command-line tool to run a comprehensive health check and audit on any website."
readme = "README.md"
requires-python = ">=3.9"
license = {text = "MIT"}
authors = [
    {name = "KnowOneActual"}
]
dependencies = [
    "LinkChecker",
    "requests",
    "dnspython",
    "webtech",
    "beautifulsoup4",
    "lxml",
    "colorama",
    "defusedxml",
    "rich",
    "ruff",
]

[project.scripts]
web-health-scanner = "web_health_scanner.cli:main"
whs = "web_health_scanner.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
include = ["web_health_scanner*"]

[tool.ruff]
# Target Python version
target-version = "py39"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "C4", "SIM", "TID"]
ignore = []

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
skip-magic-trailing-comma = false
line-ending = "auto"
